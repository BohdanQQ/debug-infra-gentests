# TODO entire section
[general.paths]

# all paths are interpreted RELATIVE TO THIS FILE
# unless path-root is set

# an absolute path to the "project folder" - all other
# paths are relative to this directory even if they 
# are in the absolute form
#path-root = '/home/user/test/project-bravo

# path where the module mapping should be generated
# - module mapping is created in the call tracing stage
# - module mapping is a prerequisite for all subsequent stages
module-maps-dir = './modmaps'

# function selection path
# - function selection is generated in the call tracing stage
# - it is required to guide the capture/test stage recompilation of the target program
fn-selection = './selection.bin'

# call trace export path
call-trace-export = './call-trace.out'

# argument traces are generated in the argument tracing stage and
# serve in the testing stage
#arg-traces-dir    = './traces'

# stdout and stderr of each test run is saved in this location
#outputs-dir       = './outputs'

# common for all components
# TODO
[general.options]
# TODO: decide if this is needed/necessary for all components? (just llcap server?)
# if true, each respective stage will clear out its output
# paths before proceeding
# if false, the instrumentation will fail if the paths above
# already exist at the time of their creation attempt 
replace = false

# defines lists of constants that guide instrumentation
[general.instrumentation-constants]
# TODO
# special argument/function markers - do not touch this area!
fn-not-in-system-header-marker = { key = 'VSTR-NOT-SYSTEM-HEADER', value = 'notinsystemheader' }
arg-numeric-unsigned-marker = { key = 'LLCAP_UNSIGNED_IDCS' }
this-ptr-marker = { key = 'VSTR-LLVM-THIS' }
marker-singlechar-sep = '#'

# this table configures the llvm pass' runtime behavior
[llvm-pass]
# the llvm-pass'es configuration can be overridden on the command line by passing
# -mllvm [arg]
# these include some paths from the table above:
# module-maps-dir:  -mllvm -llcap-mapdir
#fn-selection: -mllvm -llcap-fn-targets-file

# TODO - try to see how this could be really used - cmdline still needs a path to the config...
# default instrumentation type
# obeyed only when the pass has not been supplied any instrumentation
# type arguments (-mllvm -Call, -mllvm -Arg)
# possible values "Call" and "Arg"
default-instrumentation-mode = "Call"

# use function name mangling to filter out stdlib functions
# (ineffective in C programs)
# pass args: -mllvm -llcap-filter-by-mangled
mangling-std-filter = false

# instrument functions so that their exit can be intercepted
# when testing them
# in this configuration, testing mode declares the test as `Pass`ed 
# if the function returns normally or `Exception` if an exception was 
# thrown during the function's execution and the exception would 
# otherwise propagate outside the function
# pass args: -mllvm -llcap-instrument-fn-exit
instrument-for-fn-exit = true

fn-target-regex = "" # no regex matching

verbose = true
debug = true

