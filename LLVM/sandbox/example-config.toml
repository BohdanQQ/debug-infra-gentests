test-case-timeout-sec = 3

# report path - either .txt or .json file
report = './report.json'

# global timeout for a test job - counter roughly from 
# the start of the target program
#test-job-timeout-secs     = 100


# -------- BEGIN: custom type description
# descriptions are read by the AST pass and the LLVM IR pass
# that cooperate to insert instrumentation in desired places
[nonllvm-types.stdstring]
# arbitrary yet UNIQUE tag (used in IR to mark the argument)
key = 'VSTR-CXX-STD-STRING'
# corresponding hooklib function that gets a pointer to the
# value of this type
hooklib-fn = 'llcap_hooklib_extra_cxx_string'
log-name = 'std::string'                      # appears in the logs
# typename matches - can be defined more than once.
# Any single match will cause the binding of the
# argument to hooklib-fn to take place
[[nonllvm-types.stdstring.typenames]]
# allowed values: exact, regex
type = 'exact'
# exact matches look for value/pointer/reference
# that match the value as specified here:
value = 'class std::basic_string<char>'
# -------- END: custom type description
